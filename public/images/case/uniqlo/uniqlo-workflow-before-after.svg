<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Before to after workflow</title>
  <desc id="desc">Replace with the simplified primary evidence graphic</desc>
  <rect width="1800" height="1000" fill="#15171A"/>
  <rect x="32" y="32" width="1736" height="936" rx="32" fill="#1E2126" stroke="#4A4F58" stroke-width="4" stroke-dasharray="18 14"/>
  <rect x="808" y="320" width="184" height="48" rx="24" fill="#E60012"/>
  <text x="900" y="354" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">IMAGE PLACEHOLDER</text>
  <text x="900" y="448" text-anchor="middle" fill="#F6F7F8" font-size="54" font-weight="700" font-family="Arial, Helvetica, sans-serif">Before → after workflow</text>
  <text x="900" y="508" text-anchor="middle" fill="#C7CBD2" font-size="30" font-family="Arial, Helvetica, sans-serif">Replace with the simplified primary evidence graphic</text>
